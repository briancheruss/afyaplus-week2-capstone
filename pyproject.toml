[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afyaplus-rag-agent"
version = "0.1.0"
description = "Privacy-first, grounded medical insurance and clinical routing assistant (educational demo)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-ollama>=1.0,<2.0",
  "llama-index-core>=0.12,<1.0",
  "llama-index-embeddings-huggingface>=0.5,<1.0",
  "llama-index-vector-stores-chroma>=0.4,<1.0",
  "chromadb>=0.5,<2.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1.0"]

[project.scripts]
afyaplus = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
